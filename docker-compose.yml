services:
  backend:
    build:
      context: ./backend
    image: masterplan-backend:1.0.0
    container_name: masterplan-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      JWT_PUBLIC_SECRET: halka_acik_anahtar_kirilmali
      JWT_INTERNAL_SECRET: ic_dunyada_kullanilan_guclu_anahtar_v2
      AES_MASTER_KEY: 8f4a91c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0
      DB_PATH: /app/data/masterplan.db
      RATE_LIMIT_GLOBAL: 120
      RATE_LIMIT_AUTH: 8
      RATE_LIMIT_VAULT: 3
      CORS_ORIGIN: "*"
    volumes:
      - backend-data:/app/data
    networks:
      - masterplan-net
    expose:
      - "4000"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false

  frontend:
    build:
      context: ./frontend
    image: masterplan-frontend:1.0.0
    container_name: masterplan-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - masterplan-net
    expose:
      - "80"

  edge:
    image: nginx:1.27-alpine
    container_name: masterplan-edge
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - masterplan-net

volumes:
  backend-data:

networks:
  masterplan-net:
    driver: bridge
